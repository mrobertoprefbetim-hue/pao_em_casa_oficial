<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pão em Casa - Cadastros</title>
<style>body{font-family:Arial;padding:12px}label{display:block;margin-top:8px}input,select,textarea{width:100%;padding:8px;margin-top:4px}</style>
</head>
<body>
<h1>Pão em Casa - Cadastros</h1>
<select id="role" onchange="renderForm()"><option value="client">Cliente</option><option value="shop">Padaria</option><option value="rider">Motoboy</option></select>
<div id="form"></div>
<script>
function renderForm(){const r=document.getElementById('role').value; const f=document.getElementById('form'); if(r==='client'){f.innerHTML=`<h3>Cadastro Cliente</h3><label>Nome<input id=name></label><label>Email<input id=email></label><label>Telefone<input id=phone></label><label>Endereço completo<textarea id=address></textarea></label><label>Identidade (foto/PDF)<input id=identity type=file></label><button onclick="submitClient()">Cadastrar Cliente</button>`}
 if(r==='shop'){f.innerHTML=`<h3>Cadastro Padaria</h3><label>Nome<input id=sname></label><label>Email<input id=semail></label><label>Telefone<input id=sphone></label><label>Endereço<textarea id=saddress></textarea></label><label>Instagram<input id=inst></label><label>Facebook<input id=fb></label><label>WhatsApp<input id=wa></label><label>Pix Key<input id=spix></label><button onclick="submitShop()">Cadastrar Padaria</button>`}
 if(r==='rider'){f.innerHTML=`<h3>Cadastro Motoboy</h3><label>Nome<input id=rname></label><label>Email<input id=remail></label><label>Telefone<input id=rphone></label><label>Pix Key<input id=rpix></label><label>CNH Frente<input id=cnhf type=file></label><label>CNH Verso<input id=cnhb type=file></label><label>Marca<input id=make></label><label>Modelo<input id=model></label><label>Cor<input id=color></label><label>Placa<input id=plate></label><label>Documento Veículo<input id=vdoc type=file></label><button onclick="submitRider()">Cadastrar Motoboy</button>`}}
async function submitClient(){const name=document.getElementById('name').value; const email=document.getElementById('email').value; const phone=document.getElementById('phone').value; const address=document.getElementById('address').value; const f=document.getElementById('identity').files[0]; const reg = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,phone,role:'client'})}); const js=await reg.json(); if(f){const fd=new FormData(); fd.append('identity', f); await fetch('/api/users/'+js.id+'/identity',{method:'POST',body:fd});} alert('Cliente cadastrado') }
async function submitShop(){const name=document.getElementById('sname').value; const email=document.getElementById('semail').value; const phone=document.getElementById('sphone').value; const address=document.getElementById('saddress').value; const inst=document.getElementById('inst').value; const fb=document.getElementById('fb').value; const wa=document.getElementById('wa').value; const pix=document.getElementById('spix').value; const reg = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,phone,role:'shop',pix_key:pix})}); const js=await reg.json(); await fetch('/api/shops',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:js.id,name, address_id:null, phone, email, website:null, social_instagram:inst, social_facebook:fb, social_whatsapp:wa, payout_pix_key:pix})}); alert('Padaria cadastrada') }
async function submitRider(){const name=document.getElementById('rname').value; const email=document.getElementById('remail').value; const phone=document.getElementById('rphone').value; const pix=document.getElementById('rpix').value; const cnhf=document.getElementById('cnhf').files[0]; const cnhb=document.getElementById('cnhb').files[0]; const make=document.getElementById('make').value; const model=document.getElementById('model').value; const color=document.getElementById('color').value; const plate=document.getElementById('plate').value; const vdoc=document.getElementById('vdoc').files[0]; const reg = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,phone,role:'rider',pix_key:pix})}); const js=await reg.json(); if(cnhf || cnhb){const fd=new FormData(); if(cnhf) fd.append('cnh_front', cnhf); if(cnhb) fd.append('cnh_back', cnhb); await fetch('/api/riders/'+js.id+'/cnh',{method:'POST',body:fd}); } if(vdoc){const fd2=new FormData(); fd2.append('vehicle_doc', vdoc); fd2.append('make', make); fd2.append('model', model); fd2.append('color', color); fd2.append('plate', plate); await fetch('/api/riders/'+js.id+'/vehicle',{method:'POST',body:fd2}); } alert('Motoboy cadastrado') }
renderForm();
</script>
</body>
</html>
